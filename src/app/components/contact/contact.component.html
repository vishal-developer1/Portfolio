<section id="contact" class="py-20 bg-gray-900 text-white text-center">
  <h2 class="text-4xl font-bold mb-10 text-blue-400">
    <i class="fas fa-envelope-open-text text-blue-400 mr-2"></i> Contact Me
  </h2>

  <!-- Contact Form -->
  <form class="max-w-lg mx-auto space-y-4">
    <div class="flex items-center bg-gray-800 rounded-lg overflow-hidden">
      <i class="fas fa-user text-blue-400 p-3"></i>
      <input
        type="text"
        placeholder="Your Name"
        class="w-full p-3 bg-gray-800 text-white focus:outline-none"
        required
      />
    </div>

    <div class="flex items-center bg-gray-800 rounded-lg overflow-hidden">
      <i class="fas fa-envelope text-pink-400 p-3"></i>
      <input
        type="email"
        placeholder="Your Email"
        class="w-full p-3 bg-gray-800 text-white focus:outline-none"
        required
      />
    </div>

    <div class="flex items-start bg-gray-800 rounded-lg overflow-hidden">
      <i class="fas fa-comment-dots text-green-400 p-3 mt-2"></i>
      <textarea
        placeholder="Your Message"
        rows="4"
        class="w-full p-3 bg-gray-800 text-white focus:outline-none resize-none"
        required
      ></textarea>
    </div>

    <button
      type="submit"
      class="px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-semibold transition-all duration-300 transform hover:scale-105"
    >
      <i class="fas fa-paper-plane mr-2"></i> Send Message
    </button>
  </form>

  <!-- Social Links -->
  <div class="flex justify-center space-x-8 mt-10 text-2xl">
    <a
      href="https://linkedin.com"
      target="_blank"
      class="hover:text-blue-400 transition transform hover:scale-110"
    >
      <i class="fab fa-linkedin"></i>
    </a>
    <a
      href="https://github.com"
      target="_blank"
      class="hover:text-gray-300 transition transform hover:scale-110"
    >
      <i class="fab fa-github"></i>
    </a>

  </div>
</section>
